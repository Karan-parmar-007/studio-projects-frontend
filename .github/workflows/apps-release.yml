# Tag apps-v1.2.3 (or run manually) -> build the Studio Flow clients for every OS
# and upload them to Studio, which stores them in Garage and serves them from
# /api/studio/downloads/whisperflow/<platform>. Nothing is committed to the repo.
#
# Required secrets:
#   STUDIO_UPLOAD_URL      e.g. https://studio.karanparmar.in
#   STUDIO_RELEASE_TOKEN   matches STUDIO_RELEASE_TOKEN in studio-projects-backend .env (web VPS)
# Optional (store-signed APK; otherwise debug-signed):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Apps release

on:
  push:
    tags: ["apps-v*"]
  workflow_dispatch:

concurrency:
  group: apps-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            filename: StudioFlow.exe
            content_type: application/vnd.microsoft.portable-executable
          - os: ubuntu-latest
            platform: linux
            filename: StudioFlow
            content_type: application/octet-stream
          - os: macos-latest
            platform: macos
            filename: StudioFlow-macos.zip
            content_type: application/zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Linux system libraries (PortAudio for the mic, Tk, evdev headers)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 python3-tk linux-libc-dev

      - name: Install build dependencies
        working-directory: apps/desktop
        run: pip install -r requirements-dev.txt

      - name: Tests
        working-directory: apps/desktop
        run: python -m pytest -q tests

      - name: Build
        working-directory: apps/desktop
        run: pyinstaller --clean --noconfirm StudioFlow.spec

      - name: Package macOS .app
        if: runner.os == 'macOS'
        working-directory: apps/desktop/dist
        run: ditto -c -k --keepParent StudioFlow.app StudioFlow-macos.zip

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "name=${GITHUB_REF_NAME#apps-v}" >> "$GITHUB_OUTPUT"

      - name: Upload to Studio (Garage)
        shell: bash
        env:
          URL: ${{ secrets.STUDIO_UPLOAD_URL }}
          TOKEN: ${{ secrets.STUDIO_RELEASE_TOKEN }}
          VER: ${{ steps.ver.outputs.name }}
        run: |
          curl -fsS --retry 3 -X PUT \
            "$URL/api/studio/admin/downloads/whisperflow/${{ matrix.platform }}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Filename: ${{ matrix.filename }}" \
            -H "X-Version: ${VER:-0.0.0}" \
            -H "Content-Type: ${{ matrix.content_type }}" \
            --data-binary "@apps/desktop/dist/${{ matrix.filename }}"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioFlow-${{ matrix.platform }}
          path: apps/desktop/dist/${{ matrix.filename }}

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Version from tag
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#apps-v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk StudioFlow.apk

      - name: Upload to Studio (Garage)
        env:
          URL: ${{ secrets.STUDIO_UPLOAD_URL }}
          TOKEN: ${{ secrets.STUDIO_RELEASE_TOKEN }}
          VER: ${{ steps.ver.outputs.name }}
        run: |
          curl -fsS --retry 3 -X PUT \
            "$URL/api/studio/admin/downloads/whisperflow/android" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Filename: StudioFlow.apk" \
            -H "X-Version: ${VER:-0.0.0}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@apps/android/StudioFlow.apk"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioFlow-android
          path: apps/android/StudioFlow.apk
