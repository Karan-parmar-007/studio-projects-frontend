# Studio Flow apps: desktop unit tests on every push/PR that touches apps/.
# Nothing is built here. Installers are built on Karan's PC and uploaded with
# apps/release.sh (see apps/README.md).

name: Apps test

on:
  push:
    branches: [master]
    paths: ["apps/**", ".github/workflows/apps-ci.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps-ci.yml"]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest==8.4.2

      - name: Desktop tests
        working-directory: apps/desktop
        run: python -m pytest -q tests
